name: Claude Keepalive

on:
  schedule:
    # Every 4h 45m — stays safely under the 5h rolling window
    # even accounting for GitHub Actions cron drift (5–15 min).
    - cron: "0 0,5,10,15,20 * * *"
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Claude Code
        run: npm install -g @anthropic-ai/claude-code

      - name: Ping Claude
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          echo "hi" | claude -p "Reply with a single word: ok"
