name: Claude Keepalive

on:
  schedule:
    # 5 pings par jour à heures fixes (UTC) : 00h, 05h, 10h, 15h, 20h.
    # Écart de 5h entre chaque ping (4h entre 20h et minuit) : chaque ping
    # tombe à la fin de la fenêtre précédente et ouvre donc une nouvelle
    # fenêtre de 5h. GitHub peut retarder le cron de 5 à 15 min, c'est sans
    # conséquence ici.
    - cron: "0 0,5,10,15,20 * * *"
  workflow_dispatch: {}

# Droits minimaux : le workflow n'a pas besoin d'écrire dans le dépôt.
permissions:
  contents: read

# Évite deux pings en même temps (ex. un lancement manuel pendant un cron).
concurrency:
  group: claude-keepalive
  cancel-in-progress: false

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check token is configured
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          if [ -z "$CLAUDE_CODE_OAUTH_TOKEN" ]; then
            echo "::error::Secret CLAUDE_CODE_OAUTH_TOKEN manquant. Ajoute-le dans Settings > Secrets and variables > Actions."
            exit 1
          fi

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Claude Code
        run: |
          npm install -g @anthropic-ai/claude-code
          claude --version

      - name: Ping Claude
        env:
          RAW_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          # Supprime espaces et retours à la ligne collés par erreur dans le secret
          # (un token copié depuis un terminal est souvent coupé sur 2 lignes).
          CLAUDE_CODE_OAUTH_TOKEN="$(printf '%s' "$RAW_TOKEN" | tr -d '[:space:]')"
          export CLAUDE_CODE_OAUTH_TOKEN
          # < /dev/null : évite que la commande attende une entrée dans le CI
          set +e
          out=$(claude -p "Reply with a single word: ok" < /dev/null 2>&1)
          rc=$?
          echo "$out"
          if [ "$rc" -ne 0 ]; then
            # Remonte le message d'erreur dans l'en-tête du run (onglet Summary)
            msg=$(printf '%s' "$out" | head -c 600 | tr '\n' ' ')
            echo "::error title=Ping Claude failed (exit $rc)::$msg"
            exit "$rc"
          fi
